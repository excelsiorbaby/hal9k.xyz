<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>HAL9K</title>

  <style>

    html, body {

      height: 100%;

      margin: 0;

    }

    body {

      background: #1b1d1f;

      color: #7CFC00;

      font-family: "Courier New", Courier, monospace;

      display: flex;

      align-items: center;

      justify-content: center;

    }

    main {

      width: min(90%, 700px);

      padding: 2rem;

    }

    h1 {

      margin: 0 0 1rem;

      font-size: clamp(3rem, 10vw, 6rem);

      font-weight: 700;

      letter-spacing: 0.08em;

    }

    p {

      margin: 0.4rem 0;

      font-size: 1rem;

      line-height: 1.6;

    }

    .muted {

      color: #8fa68f;

    }

    a {

      color: inherit;

      text-decoration: none;

      border-bottom: 1px dotted currentColor;

    }

    .cursor {

      display: inline-block;

      margin-left: 0.15em;

      animation: blink 1s steps(1) infinite;

    }

    @keyframes blink {

      50% { opacity: 0; }

    }

  </style>

</head>

<body>

  <main>

    <h1>HAL9K</h1>

    <p>Nothing much to see here.<span class="cursor">_</span></p>

    <p class="muted">

      Halley Martin · systems · data · assorted projects

    </p>

    <p class="muted">

      <a href="mailto:halleymartin@gmail.com">halleymartin@gmail.com</a>

    </p>

  </main>

</body>

</html>
